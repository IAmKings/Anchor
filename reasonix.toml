t0 = time.time()\n    N = 50\n    for _ in range(N):\n        model(**enc)\n    lat_ms = (time.time() - t0) / N * 1000\n    # 单条\n    enc1 = tok(samples[0], return_tensors=\"pt\", max_length=128, truncation=True, padding=\"max_length\")\n    for _ in range(5):\n        model(**enc1)\n    t0 = time.time()\n    for _ in range(N):\n        model(**enc1)\n    lat1_ms = (time.time() - t0) / N * 1000\n\nprint(f\"chinese_roberta_L-4_H-256: 参数量 {n_params/1e6:.1f}M | 磁盘 {size/1e6:.1f}MB\")\nprint(f\"  批处理 3 条(128token) CPU: {lat_ms:.0f} ms/批\")\nprint(f\"  单条(128token) CPU: {lat1_ms:.0f} ms/条\")\nPYEOF\npython3 /tmp/bench_uer.py", "Bash=cat > /tmp/meta3.py << 'PYEOF'\nimport os, datetime\nos.environ.setdefault(\"HF_HUB_DISABLE_PROGRESS_BARS\", \"1\")\nfrom huggingface_hub import HfApi\n\nrepos = [\n    \"google/mobilebert-uncased\",\n    \"onnx-community/mobilebert-uncased-ONNX\",\n    \"uer/chinese_roberta_L-4_H-256\",\n]\napi = HfApi()\nfor r in repos:\n    print(\"=\" * 10, r, \"=\" * 10)\n    try:\n        info = api.model_info(r, files_metadata=True)\n        print(\"lastModified:\", info.lastModified)\n        try:\n            print(\"downloads:\", info.downloads)\n        except Exception:\n            print(\"downloads: n/a\")\n        files = sorted(info.siblings, key=lambda s: s.lastModified or datetime.datetime.min, reverse=True)\n        for f in files[:6]:\n            lm = f.lastModified.strftime(\"%Y-%m-%d\") if f.lastModified else \"?\"\n            sz = f.size / 1e6 if f.size else 0\n            print(f\"  {lm}  {sz:7.1f}MB  {f.rfilename}\")\n    except Exception as e:\n        print(\"FAIL\", type(e).__name__, str(e)[:120])\nPYEOF\npython3 /tmp/meta3.py", "Bash=cat > /tmp/commits3.py << 'PYEOF'\nimport os\nos.environ.setdefault(\"HF_HUB_DISABLE_PROGRESS_BARS\", \"1\")\nfrom huggingface_hub import HfApi\napi = HfApi()\nfor r in [\"google/mobilebert-uncased\", \"onnx-community/mobilebert-uncased-ONNX\", \"uer/chinese_roberta_L-4_H-256\"]:\n    try:\n        