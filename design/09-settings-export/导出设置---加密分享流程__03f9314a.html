<style>

<body class="min-h-screen pb-32">
<!-- Top App Bar (Modified to act as a back navigation for this transactional page) -->

<span class="material-symbols-outlined">arrow_back</span>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">导出数据给医生</h1>

</header>
<!-- Main Content Canvas -->

<!-- Header Image Area (Atmospheric) -->

<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent"></div>
</section>
<!-- Section: Data Range Selection -->
<section class="space-y-stack-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">选择导出范围</h2>
<div class="bg-surface-card rounded-xl border border-border-subtle p-4 space-y-4">
<!-- Option 1 -->
<label class="flex items-start space-x-3 cursor-pointer group">
<div class="flex-shrink-0 mt-1">
<input checked="" class="form-checkbox h-5 w-5 text-primary border-outline-variant rounded focus:ring-primary focus:ring-opacity-50 transition-colors" type="checkbox"/>
</div>
<div>
<p class="font-body-md text-body-md text-text-primary">最近两周记录</p>
<p class="font-label-md text-label-md text-text-muted mt-1">包含这段时间内的所有关键数据，适合常规复诊。</p>
</div>
</label>
<div class="h-px bg-border-subtle w-full"></div>
<!-- Option 2 -->
<label class="flex items-start space-x-3 cursor-pointer group">
<div class="flex-shrink-0 mt-1">
<input checked="" class="form-checkbox h-5 w-5 text-primary border-outline-variant rounded focus:ring-primary focus:ring-opacity-50 transition-colors" type="checkbox"/>
</div>
<div>
<p class="font-body-md text-body-md text-text-primary">所有情绪卡片</p>
<p class="font-label-md text-label-md text-text-muted mt-1">导出所有的情绪波动和触发事件记录。</p>
</div>
</label>
<div class="h-px bg-border-subtle w-full"></div>
<!-- Option 3 -->
<label class="flex items-start space-x-3 cursor-pointer group">
<div class="flex-shrink-0 mt-1">
<input checked="" class="form-checkbox h-5 w-5 text-primary border-outline-variant rounded focus:ring-primary focus:ring-opacity-50 transition-colors" type="checkbox"/>
</div>
<div>

</div>
</label>

<!-- Section: Security & Encryption -->
<section class="space-y-stack-sm">

<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container cursor-pointer transition-colors duration-300" for="encryption-toggle"></label>
</div>
</div>
<div class="transition-all duration-300 overflow-hidden mt-4" id="password-container">

                    </p>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md text-text-primary placeholder-text-muted transition-colors" placeholder="设置访问密码" type="password"/>
<button aria-label="显示密码" class="absolute right-0 top-2 text-text-muted hover:text-primary transition-colors" onclick="togglePasswordVisibility(this)" type="button">

</div>
</div>
</div>

</div>
</label>
</div>

<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-xl border-t border-border-subtle/30 pt-4 pb-safe px-margin-page z-40 pb-8">
<div class="max-w-2xl mx-auto flex flex-col items-center">
<button class="w-full bg-primary hover:bg-primary/90 text-surface-card font-headline-lg-mobile text-headline-lg-mobile py-4 rounded-xl shadow-none active:scale-[0.98] transition-all flex justify-center items-center gap-2">
<span class="material-symbols-outlined fill">ios_share</span>
                生成并分享加密文件
            </button>
<p class="mt-4 font-label-md text-label-md text-text-muted flex items-center justify-center gap-1 text-center">
<span class="material-symbols-outlined text-[14px]">shield</span>
                数据仅保存在本地，导出过程不经过任何云端。
            </p>
</div>
</div>
<!-- Navigation Drawer & BottomNavBar are SUPPRESSED because this is a Transactional/Linear task focused page. -->
<script>
        // Toggle password visibility
        function togglePasswordVisibility(button) {
            const input = button.previousElementSibling;
            const icon = button.querySelector('span');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Toggle encryption section visibility based on switch
        document.getElementById('encryption-toggle').addEventListener('change', function(e) {
            const container = document.getElementById('password-container');
            const input = container.querySelector('input');
            if (e.target.checked) {
                container.style.opacity = '1';
                container.style.height = container.scrollHeight + 'px';
                container.style.marginTop = '1rem';
                input.disabled = false;
            } else {
                container.style.opacity = '0';
                container.style.height = '0';
                container.style.marginTop = '0';
                input.disabled = true;
            }
        });
        
        // Initial setup for the animation height
        window.addEventListener('DOMContentLoaded', () => {
             const container = document.getElementById('password-container');
             if(document.getElementById('encryption-toggle').checked) {
                 container.style.height = container.scrollHeight + 'px';
             }
        });
    </script>
