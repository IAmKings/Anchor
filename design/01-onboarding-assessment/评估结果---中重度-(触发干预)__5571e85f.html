<style>
        body { font-family: 'Manrope', sans-serif; }
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-border-subtle) 1px, transparent 1px);
            background-size: 24px 24px;
        }

            animation: pulse-op 4s ease-in-out infinite;
        }
        @keyframes pulse-op {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-text-primary antialiased min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Effect -->
<div class="fixed inset-0 pointer-events-none bg-pattern opacity-30 z-0"></div>
<div class="fixed top-0 left-0 w-full h-64 bg-gradient-to-b from-surface-container-low to-transparent z-0"></div>
<!-- TopAppBar (from JSON) -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-dark-bg/80 backdrop-blur-xl border-b border-border-subtle/30 flex justify-between items-center px-margin-page h-16">
<button aria-label="Emergency" class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-300 group">
<span class="material-symbols-outlined text-secondary dark:text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">emergency</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tight">锚点 Anchor</h1>
<button aria-label="Settings" class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline-variant">settings</span>
</button>
</header>
<!-- Main Canvas -->
<main class="relative z-10 pt-28 pb-40 px-margin-page max-w-lg mx-auto flex flex-col gap-stack-lg">
<!-- Section: Assessment Score -->
<section class="flex flex-col items-center justify-center pt-8 pb-4">
<div class="relative flex flex-col items-center justify-center w-48 h-48 rounded-full border border-border-subtle bg-surface-container-lowest shadow-sm pulse-slow mb-stack-md">
<span class="font-numeral-mono text-secondary text-6xl tracking-tighter" style="font-size: 80px; line-height: 1;">16</span>
<div class="absolute -bottom-4 bg-secondary text-on-secondary px-6 py-1.5 rounded-full font-label-md text-label-md shadow-sm border border-surface-container-lowest">
                    中度至重度
                </div>
</div>
</section>
<!-- Section: Key Insight (The Anchor Statement) -->
<section class="bg-surface-card rounded-xl border border-border-subtle p-6 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary-container"></div>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed indent-8 relative z-10">
<span class="material-symbols-outlined text-tertiary-container absolute -left-6 -top-2" style="font-size: 32px; opacity: 0.4;">format_quote</span>
                判断这个不是你的工作，是医生的工作。<br/>
                去做一次评估，是为了终结自我审判。
            </p>
</section>
<!-- Section: Medical Waiting Period Mode (Bento Grid) -->
<section class="flex flex-col gap-stack-sm">
<div class="flex items-center gap-2 px-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary">就医等待期模式</h2>
</div>
<p class="font-label-md text-label-md text-text-muted px-2 pb-2">日常练习已暂时隐去，请优先关注专业介入。</p>
<div class="grid grid-cols-2 gap-gutter-card">
<!-- Action Card 1 -->
<button class="bg-surface-container-lowest border border-border-subtle rounded-xl p-5 flex flex-col items-start gap-4 active:scale-[0.98] transition-transform duration-200 hover:bg-surface-container-low shadow-sm group">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center group-hover:bg-primary-container/40 transition-colors">
<span class="material-symbols-outlined text-primary">local_hospital</span>
</div>
<div class="text-left">
<span class="block font-body-md text-body-md text-text-primary mb-1">就医指南</span>
<span class="block font-label-md text-label-md text-text-muted">了解看诊流程与准备</span>
</div>
</button>
<!-- Action Card 2 -->
<button class="bg-surface-container-lowest border border-border-subtle rounded-xl p-5 flex flex-col items-start gap-4 active:scale-[0.98] transition-transform duration-200 hover:bg-surface-container-low shadow-sm group">
<div class="w-10 h-10 rounded-full bg-tertiary-container/20 flex items-center justify-center group-hover:bg-tertiary-container/40 transition-colors">
<span class="material-symbols-outlined text-tertiary">checklist</span>
</div>
<div class="text-left">
<span class="block font-body-md text-body-md text-text-primary mb-1">躯体检查清单</span>
<span class="block font-label-md text-label-md text-text-muted">排除生理因素干扰</span>
</div>
</button>
</div>
</section>
<!-- Section: Crisis Intervention 1-2-3 -->
<section class="bg-surface-container-lowest border border-border-subtle rounded-xl p-6 shadow-sm">
<h3 class="font-body-md text-body-md text-text-primary font-semibold mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-size: 20px;">health_and_safety</span>
                危机干预 1-2-3
            </h3>
<div class="flex flex-col gap-6 relative">
<!-- Vertical Line Connector -->
<div class="absolute left-4 top-2 bottom-6 w-px bg-border-subtle"></div>
<!-- Step 1 -->
<div class="flex gap-4 relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center border border-border-subtle shrink-0">
<span class="font-numeral-mono text-label-md text-text-primary">1</span>
</div>
<div class="pt-1">
<h4 class="font-label-md text-label-md text-text-primary font-semibold">识别失控信号</h4>
<p class="font-label-md text-label-md text-text-muted mt-1">深呼吸，确认当前情绪强度是否超过承受阈值。</p>
</div>
</div>
<!-- Step 2 -->
<div class="flex gap-4 relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center border border-border-subtle shrink-0">
<span class="font-numeral-mono text-label-md text-text-primary">2</span>
</div>
<div class="pt-1">
<h4 class="font-label-md text-label-md text-text-primary font-semibold">物理隔离</h4>
<p class="font-label-md text-label-md text-text-muted mt-1">离开当前刺激源，寻找一个安全、安静的角落。</p>
</div>
</div>
<!-- Step 3 -->
<div class="flex gap-4 relative z-10">
<div class="w-8 h-8 rounded-full bg-secondary-container/30 flex items-center justify-center border border-secondary/30 shrink-0">
<span class="font-numeral-mono text-label-md text-secondary">3</span>
</div>
<div class="pt-1">
<h4 class="font-label-md text-label-md text-secondary font-semibold">发起求助</h4>
<p class="font-label-md text-label-md text-text-muted mt-1">联系紧急联系人或拨打专业援助热线。</p>
</div>
</div>
</div>
</section>
</main>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home_app_logo</span>

<!-- Tab 4: Inactive (我的) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 active:scale-90 transition-transform duration-200 hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors w-16 h-14 rounded-lg">
