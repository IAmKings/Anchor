<style>
        /* Custom Keyframes for Calm Breathing Animation */
        @keyframes gentle-pulse {
            0% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.6); opacity: 0.05; }
            100% { transform: scale(1); opacity: 0.15; }
        }
        @keyframes float-center {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-breathe-inner { animation: gentle-pulse 6s ease-in-out infinite; }
        .animate-breathe-outer { animation: gentle-pulse 6s ease-in-out infinite 2s; }
        .animate-float { animation: float-center 8s ease-in-out infinite; }
        .animate-fade-in { animation: fade-in-up 1.5s ease-out forwards; }
        
        /* Ensure specific font family loading if available, else fallback */
        body { font-family: 'manrope', system-ui, -apple-system, sans-serif; }
