<section class="flex flex-col items-center justify-center w-full pt-8 animate-fade-in-up">
<div class="relative w-48 h-48 mb-6 flex items-center justify-center">
<!-- SVG Circle Progress -->
<svg class="circular-progress w-full h-full absolute inset-0" viewbox="0 0 100 100">
<!-- Background Circle -->
<circle class="text-surface-container" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="6"></circle>
<!-- Progress Circle (4/27 = ~15%) -->
<circle class="text-primary-container" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="240" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<!-- Inner Content -->
<div class="flex flex-col items-center justify-center relative z-10 bg-surface-card rounded-full w-40 h-40 shadow-sm border border-border-subtle">
<span class="font-numeral-mono text-numeral-mono text-primary">4<span class="text-text-muted text-body-md">/27</span></span>

</div>
</div>
<div class="text-center space-y-2 max-w-md">
<p class="font-body-lg text-body-lg text-text-primary">这是一次自我觉察，而非最终判决。</p>
</div>
</section>
<!-- Section 3, 4 & 5: Micro-actions -->

</div>
<div>

</div>
</div>

<p class="font-label-md text-label-md text-text-muted uppercase tracking-wider">一次一件</p>

<!-- Option 1 -->
<label class="flex items-start p-4 rounded-lg border border-border-subtle hover:bg-surface-container-low transition-colors cursor-pointer group relative overflow-hidden">
<input class="peer sr-only" name="micro_action" type="radio"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center mr-4 mt-1 transition-colors">

</div>
<div class="flex-1">

<script>
        // Simple logic to enable the start button only when an option is selected
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="micro_action"]');
            const startBtn = document.getElementById('start-btn');

            radioButtons.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (document.querySelector('input[name="micro_action"]:checked')) {
                        startBtn.removeAttribute('disabled');
                    }
                });
            });
        });
    </script>
