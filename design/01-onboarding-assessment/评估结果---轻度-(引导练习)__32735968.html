<style>
        body { font-family: 'manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .jetbrains-mono { font-family: 'jetbrainsMono', monospace; }
        
        /* Subtle Entrance Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        /* Gentle Pulse for Score */
        @keyframes gentlePulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        .score-pulse { animation: gentlePulse 4s ease-in-out infinite; }

        /* Custom Radio Styling for Action Cards */
        .action-radio:checked + div {
            border-color: #7a9b86; /* primary-container */
            background-color: #f6f3ed; /* surface-container-low */
        }
        .action-radio:checked + div .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        .action-radio:not(:checked) + div .check-icon {
            opacity: 0;
            transform: scale(0.8);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-text-primary antialiased min-h-screen pb-[100px]">
<!-- Main Content Canvas -->
<main class="px-margin-page pt-stack-lg max-w-md mx-auto relative flex flex-col gap-stack-lg">
<!-- Score & Status Section -->
<section class="flex flex-col items-center justify-center text-center pt-stack-md animate-fade-up opacity-0">
<div class="relative w-32 h-32 flex items-center justify-center mb-stack-sm">
<!-- Decorative background blob for score -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-xl score-pulse"></div>
<div class="absolute inset-4 bg-primary-container/40 rounded-full blur-md"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="font-numeral-mono text-[48px] leading-none text-primary font-medium jetbrains-mono">6</span>
<span class="font-label-md text-label-md text-text-muted mt-1">分</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary mb-2">轻度波动</h1>
<p class="font-body-md text-body-md text-tertiary max-w-[280px]">
                暂停很正常。<br/>今天只挑最轻微的一件事试试看。
            </p>
</section>
<!-- Micro-Actions Selection Section -->
<section class="flex flex-col gap-stack-md animate-fade-up delay-100 opacity-0">
<div class="flex flex-col gap-3" id="action-list">
<!-- Action Option 1 -->
<label class="cursor-pointer group block">
<input class="peer sr-only action-radio" name="micro_action" type="radio" value="walk_downstairs"/>
<div class="p-gutter-card bg-surface-card rounded-xl border border-border-subtle transition-all duration-300 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
</div>
<div>
<h3 class="font-body-md text-body-md text-text-primary leading-tight">穿好鞋走到楼下</h3>
<p class="font-label-md text-label-md text-text-muted mt-1">无需强求走远</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-transparent">
<span class="material-symbols-outlined text-[16px] text-primary check-icon transition-all duration-200">check</span>
</div>
</div>
</label>
<!-- Action Option 2 -->
<label class="cursor-pointer group block">
<input class="peer sr-only action-radio" name="micro_action" type="radio" value="desk_tidy"/>
<div class="p-gutter-card bg-surface-card rounded-xl border border-border-subtle transition-all duration-300 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">desk</span>
</div>
<div>
<h3 class="font-body-md text-body-md text-text-primary leading-tight">整理一张桌面</h3>
<p class="font-label-md text-label-md text-text-muted mt-1">仅限视线范围内</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-transparent">
<span class="material-symbols-outlined text-[16px] text-primary check-icon transition-all duration-200">check</span>
</div>
</div>
</label>
<!-- Action Option 3 -->
<label class="cursor-pointer group block">
<input class="peer sr-only action-radio" name="micro_action" type="radio" value="drink_water"/>
<div class="p-gutter-card bg-surface-card rounded-xl border border-border-subtle transition-all duration-300 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_drink</span>
</div>
<div>
<h3 class="font-body-md text-body-md text-text-primary leading-tight">喝一杯温水</h3>
<p class="font-label-md text-label-md text-text-muted mt-1">缓慢地喝完</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-transparent">
<span class="material-symbols-outlined text-[16px] text-primary check-icon transition-all duration-200">check</span>
</div>
</div>

</div>
</section>
<!-- Confirmation Action -->
<section class="mt-4 animate-fade-up delay-200 opacity-0 pb-stack-lg">
<button class="w-full py-4 rounded-xl bg-surface-container text-text-muted font-body-md text-body-md transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed" disabled="" id="confirm-btn">
                请先选择一件小事
            </button>
<p class="text-center font-label-md text-label-md text-text-muted mt-4">
                选定后，我们将进行为期 14 天的固定练习
            </p>
</section>
</main>

<nav class="bg-surface/90 dark:bg-dark-bg/90 backdrop-blur-2xl fixed bottom-0 w-full z-50 rounded-t-xl border-t border-border-subtle/50 flat no shadows fixed bottom-0 left-0 w-full flex justify-around items-center pt-2 pb-safe px-4 pb-6">
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">home_app_logo</span>
<span class="font-label-md text-label-md">今天</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">

<span class="material-symbols-outlined mb-1">insights</span>
<span class="font-label-md text-label-md">洞察</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">我的</span>
</a>
</nav>
<script>
        // Simple logic to enable confirmation button when an option is selected
        document.addEventListener('DOMContentLoaded', () => {
            const radios = document.querySelectorAll('input[name="micro_action"]');
            const confirmBtn = document.getElementById('confirm-btn');

            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (document.querySelector('input[name="micro_action"]:checked')) {
                        confirmBtn.removeAttribute('disabled');
                        confirmBtn.classList.remove('bg-surface-container', 'text-text-muted');
                        confirmBtn.classList.add('bg-primary', 'text-surface-card', 'shadow-md');
                        confirmBtn.textContent = '确认：固定练习 14 天';
                    }
                });
            });

            confirmBtn.addEventListener('click', (e) => {
                if(!confirmBtn.hasAttribute('disabled')) {
                    // Visual feedback for click
                    confirmBtn.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        confirmBtn.style.transform = 'scale(1)';
                    }, 150);
                }
            });
        });
    </script>
</body></html>
