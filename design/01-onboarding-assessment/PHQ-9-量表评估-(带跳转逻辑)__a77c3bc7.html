<script>
        // Simple form interaction script to handle the visual state of submission
        document.getElementById('phq9-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // In a real app, this would process the score and potentially trigger the crisis flow
            // For now, we simulate a calm submission state and redirect
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '提交中...';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                window.location.href = '{{DATA:SCREEN:SCREEN_7}}';
            }, 1200);
        });

        // Add subtle animation classes for sequential rendering
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.bg-surface-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                card.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 + (index * 50)); // Staggered fade in
            });
        });
