<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Progress Comparison</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-high": "#ebe8e2",
                      "surface": "#fcf9f3",
                      "on-tertiary-container": "#302b24",
                      "secondary": "#8e4d34",
                      "tertiary-container": "#9a9288",
                      "on-primary-container": "#133222",
                      "surface-variant": "#e5e2dc",
                      "on-background": "#1c1c18",
                      "surface-container-low": "#f6f3ed",
                      "primary": "#466552",
                      "error-container": "#ffdad6",
                      "dark-card": "#262521",
                      "surface-container-highest": "#e5e2dc",
                      "secondary-container": "#feaa8b",
                      "on-primary": "#ffffff",
                      "on-primary-fixed": "#012112",
                      "tertiary-fixed": "#ebe1d6",
                      "surface-bright": "#fcf9f3",
                      "surface-card": "#FFFFFF",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-container": "#783c24",
                      "primary-container": "#7a9b86",
                      "surface-dim": "#dcdad4",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#cec5ba",
                      "background": "#fcf9f3",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed": "#380d00",
                      "secondary-fixed": "#ffdbcf",
                      "inverse-surface": "#31312d",
                      "outline-variant": "#c2c8c1",
                      "on-tertiary": "#ffffff",
                      "primary-fixed": "#c8ebd3",
                      "primary-fixed-dim": "#accfb8",
                      "text-muted": "#8A837A",
                      "on-primary-fixed-variant": "#2e4d3c",
                      "secondary-fixed-dim": "#ffb59a",
                      "error": "#ba1a1a",
                      "inverse-primary": "#accfb8",
                      "surface-tint": "#466552",
                      "on-tertiary-fixed-variant": "#4c463e",
                      "inverse-on-surface": "#f3f0ea",
                      "on-surface-variant": "#424843",
                      "tertiary": "#645d55",
                      "on-tertiary-fixed": "#1f1b14",
                      "text-primary": "#33302B",
                      "on-secondary": "#ffffff",
                      "surface-container": "#f0eee8",
                      "on-surface": "#1c1c18",
                      "dark-bg": "#1C1B18",
                      "on-secondary-fixed-variant": "#71361f",
                      "border-subtle": "#E3DDD3",
                      "outline": "#727973"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-page": "20px",
                      "gutter-card": "16px",
                      "stack-md": "24px",
                      "unit": "4px",
                      "stack-lg": "40px",
                      "stack-sm": "8px",
                      "safe": "env(safe-area-inset-bottom)"
              },
              "fontFamily": {
                      "body-md": ["Manrope", "sans-serif"],
                      "headline-lg": ["Manrope", "sans-serif"],
                      "numeral-mono": ["JetBrains Mono", "monospace"],
                      "body-lg": ["Manrope", "sans-serif"],
                      "label-md": ["Manrope", "sans-serif"],
                      "headline-lg-mobile": ["Manrope", "sans-serif"]
              },
              "fontSize": {
                      "body-md": ["17px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-lg": ["22px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "numeral-mono": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                      "body-lg": ["20px", {"lineHeight": "32px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                      "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .font-numeral-mono { font-family: 'JetBrains Mono', monospace; }
        
        .wave-container {
            position: relative;
            width: 100%;
            height: 120px;
            overflow: hidden;
            background: theme('colors.surface-container');
            border-radius: theme('borderRadius.xl');
        }
        
        .wave-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            animation: wave 10s linear infinite;
            fill: theme('colors.primary-fixed-dim');
            opacity: 0.4;
        }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        .progress-bar-bg { background-color: theme('colors.surface-variant'); }
        .progress-bar-fill { background-color: theme('colors.primary'); }
        .progress-bar-fill-baseline { background-color: theme('colors.tertiary-container'); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen pb-safe">
<!-- Nav shell is suppressed as this is a transactional/milestone screen -->
<main class="px-margin-page pt-12 pb-24 max-w-lg mx-auto">
<!-- Header -->
<header class="mb-stack-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm">第 14 天回顾</h1>
<p class="font-body-md text-body-md text-text-muted">花一点时间看看你走过的路。</p>
</header>
<!-- Insights Message (Bento Style) -->
<section class="bg-surface-card border border-border-subtle rounded-xl p-6 mb-stack-lg flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary mb-4" style="font-size: 32px; font-variation-settings: 'FILL' 1;">park</span>
<p class="font-body-lg text-body-lg text-text-primary mb-2">进步并非一条直线。</p>
<p class="font-body-md text-body-md text-text-muted">你为自己坚持了 14 天，这才是真正的锚点。</p>
</section>
<!-- PHQ-9 Comparison (Bento Grid Style) -->
<section class="mb-stack-lg">
<h2 class="font-label-md text-label-md text-text-muted mb-stack-sm uppercase tracking-wider">PHQ-9 评估对比</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Baseline -->
<div class="bg-surface-card border border-border-subtle rounded-xl p-4 flex flex-col items-center">
<span class="font-label-md text-label-md text-text-muted mb-2">初始基线</span>
<div class="font-numeral-mono text-numeral-mono text-tertiary-container mb-2">12</div>
<div class="w-full h-2 progress-bar-bg rounded-full overflow-hidden">
<div class="h-full progress-bar-fill-baseline" style="width: 60%;"></div>
</div>
</div>
<!-- New Score -->
<div class="bg-primary-fixed/20 border border-primary-fixed-dim rounded-xl p-4 flex flex-col items-center">
<span class="font-label-md text-label-md text-primary mb-2">当前评估</span>
<div class="font-numeral-mono text-numeral-mono text-primary mb-2">8</div>
<div class="w-full h-2 progress-bar-bg rounded-full overflow-hidden">
<div class="h-full progress-bar-fill" style="width: 40%;"></div>
</div>
</div>
</div>
<p class="font-label-md text-label-md text-text-muted mt-4 text-center">分数有所下降，这是一个积极的信号。</p>
</section>
<!-- Prediction Accuracy Chart -->
<section class="mb-stack-lg">
<h2 class="font-label-md text-label-md text-text-muted mb-stack-sm uppercase tracking-wider">困难预测趋于现实</h2>
<div class="bg-surface-card border border-border-subtle rounded-xl p-6">
<!-- Abstract visual representation of converging lines -->
<div class="wave-container flex items-end relative px-4 pb-2">
<svg class="wave-svg" preserveaspectratio="none" viewbox="0 0 1000 100">
<path d="M0,50 Q250,0 500,50 T1000,50 L1000,100 L0,100 Z"></path>
</svg>
<svg class="wave-svg" preserveaspectratio="none" style="animation-duration: 15s; opacity: 0.2; fill: theme('colors.secondary-container');" viewbox="0 0 1000 100">
<path d="M0,80 Q250,20 500,80 T1000,80 L1000,100 L0,100 Z"></path>
</svg>
<div class="absolute inset-0 flex justify-between items-end px-6 pb-4">
<div class="flex flex-col items-center">
<div class="w-1.5 h-16 bg-tertiary-container rounded-t-full mb-2"></div>
<span class="font-label-md text-label-md text-text-muted text-[10px]">第1天</span>
</div>
<div class="flex flex-col items-center">
<div class="w-1.5 h-12 bg-tertiary-container/80 rounded-t-full mb-2"></div>
<span class="font-label-md text-label-md text-text-muted text-[10px]">第4天</span>
</div>
<div class="flex flex-col items-center">
<div class="w-1.5 h-8 bg-primary/60 rounded-t-full mb-2"></div>
<span class="font-label-md text-label-md text-text-muted text-[10px]">第8天</span>
</div>
<div class="flex flex-col items-center">
<div class="w-1.5 h-4 bg-primary rounded-t-full mb-2"></div>
<span class="font-label-md text-label-md text-primary text-[10px] font-bold">现在</span>
</div>
</div>
</div>
<p class="font-body-md text-body-md text-text-primary mt-4 text-center">随着时间推移，你对任务难度的预估变得更加准确和现实。</p>
</div>
</section>
<!-- Actions -->
<section class="mt-stack-lg flex flex-col gap-4">
<button class="w-full py-4 bg-primary text-surface-card font-label-md text-label-md rounded-xl hover:bg-on-primary-fixed-variant transition-colors flex justify-center items-center gap-2">
                继续当前练习
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full py-4 border border-border-subtle bg-surface-card text-text-primary font-label-md text-label-md rounded-xl hover:bg-surface-container-low transition-colors">
                添加新的微小行动
            </button>
</section>
</main>
</body></html>
