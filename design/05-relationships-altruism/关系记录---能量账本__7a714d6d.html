</button>

<p class="font-body-md text-body-md text-text-muted">How did you feel after connecting?</p>
</section>

<div class="relative w-full">
<input class="w-full bg-transparent border-0 border-b-2 border-border-subtle focus:border-primary focus:ring-0 px-2 py-3 font-body-lg text-body-lg text-text-primary placeholder:text-outline-variant transition-colors bg-surface-container-lowest" placeholder="Who did you meet?" type="text"/>
</div>
<!-- Binary Choice -->
<div class="grid grid-cols-2 gap-unit">
<!-- Filled Action -->
<button class="flex flex-col items-center justify-center gap-2 p-stack-sm rounded-lg bg-primary-fixed-dim/20 hover:bg-primary-fixed-dim/30 border border-transparent active:border-primary/20 transition-all duration-300 active:scale-95">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-[28px]" data-icon="wb_sunny" data-weight="fill" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
</div>
<span class="font-label-md text-label-md text-on-primary-fixed-variant">Filled (Charge)</span>
</button>
<!-- Drained Action -->

<span class="material-symbols-outlined text-[28px]" data-icon="cloud">cloud</span>
</div>

</div>
