<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Worry Safe - Completion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1c1c18",
                        "background": "#fcf9f3",
                        "on-tertiary-container": "#302b24",
                        "on-secondary-container": "#783c24",
                        "surface-container-low": "#f6f3ed",
                        "on-primary-fixed-variant": "#2e4d3c",
                        "inverse-primary": "#accfb8",
                        "outline-variant": "#c2c8c1",
                        "surface-bright": "#fcf9f3",
                        "border-subtle": "#E3DDD3",
                        "surface-tint": "#466552",
                        "surface-dim": "#dcdad4",
                        "secondary-fixed-dim": "#ffb59a",
                        "tertiary-container": "#9a9288",
                        "surface-variant": "#e5e2dc",
                        "dark-bg": "#1C1B18",
                        "tertiary-fixed": "#ebe1d6",
                        "primary-fixed-dim": "#accfb8",
                        "dark-card": "#262521",
                        "surface-container": "#f0eee8",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "secondary": "#8e4d34",
                        "secondary-fixed": "#ffdbcf",
                        "on-secondary-fixed-variant": "#71361f",
                        "on-error-container": "#93000a",
                        "text-primary": "#33302B",
                        "inverse-surface": "#31312d",
                        "tertiary": "#645d55",
                        "primary": "#466552",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#1f1b14",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e5e2dc",
                        "secondary-container": "#feaa8b",
                        "text-muted": "#8A837A",
                        "on-primary-fixed": "#012112",
                        "primary-fixed": "#c8ebd3",
                        "on-primary-container": "#133222",
                        "on-surface-variant": "#424843",
                        "surface": "#fcf9f3",
                        "inverse-on-surface": "#f3f0ea",
                        "on-tertiary-fixed-variant": "#4c463e",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#380d00",
                        "surface-container-high": "#ebe8e2",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#cec5ba",
                        "outline": "#727973",
                        "primary-container": "#7a9b86",
                        "on-surface": "#1c1c18",
                        "surface-card": "#FFFFFF",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-page": "20px",
                        "stack-md": "24px",
                        "gutter-card": "16px",
                        "stack-lg": "40px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["manrope"],
                        "body-lg": ["manrope"],
                        "headline-lg": ["manrope"],
                        "headline-lg-mobile": ["manrope"],
                        "label-md": ["manrope"],
                        "numeral-mono": ["jetbrainsMono"]
                    },
                    "fontSize": {
                        "body-md": ["17px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-lg": ["20px", {"lineHeight": "32px", "fontWeight": "400"}],
                        "headline-lg": ["22px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "numeral-mono": ["24px", {"lineHeight": "32px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'manrope', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.text-primary');
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow {
            animation: subtlePulse 6s ease-in-out infinite;
        }
        /* Anti-KPI Minimalism: Suppress Navigation for linear flow completion */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-background">
<!-- Atmospheric Background Animation representing 'containment' and 'emptiness' -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none">

</div>
<!-- Main Content Canvas (Z-Index above background) -->
<main class="w-full max-w-md px-margin-page flex flex-col items-center justify-center z-10 relative space-y-stack-lg">
<!-- Central Illustration / Emptiness Representation -->
<div class="relative w-48 h-48 flex items-center justify-center rounded-full bg-surface-container-low border border-border-subtle shadow-sm animate-pulse-slow">
<div class="absolute inset-4 rounded-full border border-primary/20 bg-surface-card flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl opacity-70" style="font-variation-settings: 'FILL' 0; font-weight: 200;">
                    water_drop
                </span>
</div>
</div>
<!-- Typography / Messaging -->
<div class="text-center space-y-stack-sm w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary tracking-tight md:font-headline-lg md:text-headline-lg">
                整理完毕
            </h1>
<p class="font-body-md text-body-md text-text-muted px-4">
                这一刻，念头已在纸上。<br/>你可以放心地把它们留在这里。
            </p>
</div>
<!-- Summary Card -->
<div class="w-full bg-surface-card rounded-xl p-gutter-card border border-border-subtle flex items-center justify-between shadow-sm">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-tertiary">inventory_2</span>
<span class="font-body-md text-body-md text-text-primary">今日受理了 <span class="font-numeral-mono text-numeral-mono font-medium">3</span> 项忧虑</span>
</div>
<span class="material-symbols-outlined text-border-subtle">check_circle</span>
</div>
<!-- Action Area (Thumb Zone Strategy) -->
<div class="w-full flex flex-col space-y-stack-sm pt-8">
<button class="w-full h-14 bg-primary text-surface-card rounded-lg font-label-md text-label-md tracking-wide hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
<span>回到今天</span>
</button>
<button class="w-full h-14 bg-transparent border border-border-subtle text-text-primary rounded-lg font-label-md text-label-md tracking-wide hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
<span>查看计划</span>
</button>
</div>
<!-- Footer Quote -->
<div class="pt-stack-lg pb-safe">
<p class="font-label-md text-label-md text-text-muted italic opacity-60 text-center">
                “受理，而非压抑。”
            </p>
</div>
</main>
<!-- Navigation is intentionally suppressed for this completion/splash screen as per Semantic Shell Mandate -->
</body></html>
