<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>忧虑保险箱 - 专场开启</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#2e4d3c",
                        "on-secondary": "#ffffff",
                        "dark-card": "#262521",
                        "secondary": "#8e4d34",
                        "surface-tint": "#466552",
                        "secondary-fixed-dim": "#ffb59a",
                        "secondary-container": "#feaa8b",
                        "surface-container": "#f0eee8",
                        "on-primary-fixed": "#012112",
                        "text-muted": "#8A837A",
                        "primary-fixed-dim": "#accfb8",
                        "on-surface-variant": "#424843",
                        "surface-container-high": "#ebe8e2",
                        "primary-container": "#7a9b86",
                        "background": "#fcf9f3",
                        "inverse-primary": "#accfb8",
                        "surface-card": "#FFFFFF",
                        "tertiary": "#645d55",
                        "on-tertiary-container": "#302b24",
                        "on-tertiary-fixed": "#1f1b14",

                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#71361f",
                        "on-secondary-fixed": "#380d00",
                        "inverse-on-surface": "#f3f0ea",
                        "surface": "#fcf9f3",
                        "on-tertiary-fixed-variant": "#4c463e",
                        "on-tertiary": "#ffffff",

                        "text-primary": "#33302B",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e5e2dc",

                        "on-surface": "#1c1c18"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "gutter-card": "16px",
                        "stack-md": "24px",
                        "margin-page": "20px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-lg": "40px"
                    },
                    "fontFamily": {
                        "body-md": ["manrope"],
                        "headline-lg-mobile": ["manrope"],
                        "numeral-mono": ["jetbrainsMono"],
                        "body-lg": ["manrope"],
                        "label-md": ["manrope"],
                        "headline-lg": ["manrope"]
                    },
                    "fontSize": {
                        "body-md": ["17px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "numeral-mono": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],

                        "headline-lg": ["22px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]

                }
            }
        }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        /* Subtle pulsing animation for the "active session" indicator */
        @keyframes gentle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .pulse-slow {
            animation: gentle-pulse 4s ease-in-out infinite;
        }

        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        .safe-padding-bottom {
            padding-bottom: env(safe-area-inset-bottom, 80px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center">
<!-- App Container -->
<main class="w-full max-w-md mx-auto relative min-h-screen flex flex-col pb-24 safe-padding-bottom">
<!-- TopAppBar (From JSON) -->
<header class="bg-background/80 dark:bg-dark-bg/80 backdrop-blur-xl border-b border-border-subtle/30 fixed top-0 w-full z-50 flex justify-between items-center px-margin-page h-16 max-w-md">
<button class="flex items-center justify-center p-2 text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined" data-icon="emergency">emergency</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tight">锚点 Anchor</h1>
<button class="flex items-center justify-center p-2 text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Area -->
<div class="flex-1 mt-20 px-margin-page flex flex-col">
<!-- Session Status Area -->
<div class="mt-stack-md mb-stack-lg flex flex-col items-center justify-center text-center pulse-slow">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-icon="lock_open" style="font-variation-settings: 'FILL' 1;">lock_open</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">专场已开启</h2>
<p class="font-body-md text-body-md text-text-muted">深呼吸，我们开始整理。</p>
</div>
<!-- Worry Cards List -->
<div class="flex flex-col gap-stack-sm mb-stack-lg w-full">
<!-- Card 1 -->
<div class="bg-surface-card border border-border-subtle rounded-xl p-4 flex flex-col gap-2 relative overflow-hidden group">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-2 text-text-muted font-label-md text-label-md">
<span class="material-symbols-outlined text-lg" data-icon="schedule">schedule</span>
<span>昨天 14:30</span>
</div>
<div class="h-2 w-2 rounded-full bg-primary-container"></div>
</div>
<p class="font-body-md text-body-md text-on-background line-clamp-2 mt-2">
                        担心下周的项目汇报可能无法按期完成，感觉会有很多不可控的因素...
                    </p>
<div class="w-full h-8 bg-gradient-to-t from-surface-card to-transparent absolute bottom-0 left-0"></div>
</div>
<!-- Card 2 -->
<div class="bg-surface-card border border-border-subtle rounded-xl p-4 flex flex-col gap-2 relative overflow-hidden group">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-2 text-text-muted font-label-md text-label-md">
<span class="material-symbols-outlined text-lg" data-icon="schedule">schedule</span>
<span>周二 09:15</span>
</div>
<div class="h-2 w-2 rounded-full bg-surface-dim"></div>
</div>
<p class="font-body-md text-body-md text-on-background line-clamp-2 mt-2 blur-[2px] opacity-70">
                        关于人际关系的一些琐碎担忧，总觉得自己在某个场合说错了话...
                    </p>
<div class="absolute inset-0 flex items-center justify-center bg-surface-card/40 backdrop-blur-[1px] opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-label-md text-label-md text-primary bg-surface-container-low px-4 py-1 rounded-full border border-border-subtle">点击查看</span>
</div>
</div>
<!-- Card 3 -->
<div class="bg-surface-card border border-border-subtle rounded-xl p-4 flex flex-col gap-2 relative overflow-hidden group">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-2 text-text-muted font-label-md text-label-md">
<span class="material-symbols-outlined text-lg" data-icon="schedule">schedule</span>
<span>上周五 22:00</span>
</div>
<div class="h-2 w-2 rounded-full bg-surface-dim"></div>
</div>
<p class="font-body-md text-body-md text-on-background line-clamp-2 mt-2 blur-[3px] opacity-50">
                        未来的职业规划感到迷茫，不知道现在的选择是否正确...
                    </p>
<div class="absolute inset-0 flex items-center justify-center bg-surface-card/40 backdrop-blur-[1px] opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-label-md text-label-md text-primary bg-surface-container-low px-4 py-1 rounded-full border border-border-subtle">点击查看</span>
</div>
</div>
</div>
<!-- Reassurance Message -->
<div class="mt-auto mb-8 text-center px-4">
<p class="font-body-md text-body-md text-tertiary-container italic">
                    “在这里，忧虑是被受理的，而非被压抑的。”
                </p>
</div>
<!-- Process Button -->
<button class="w-full bg-primary text-on-primary rounded-full py-4 font-headline-lg-mobile text-headline-lg-mobile flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-300 mb-6">
<span>开始处理第一项</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- BottomNavBar (From JSON) -->
<nav class="bg-surface/90 dark:bg-dark-bg/90 backdrop-blur-2xl border-t border-border-subtle/50 fixed bottom-0 left-0 w-full flex justify-around items-center pt-2 pb-safe px-4 z-50 rounded-t-xl md:hidden max-w-md mx-auto right-0">
<!-- 记录 (Inactive - assuming "记录" maps best to this overview) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="home_app_logo">home_app_logo</span>
<span class="font-label-md text-label-md">今天</span>
</button>
<!-- 记录 (Active) -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="edit_note" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-label-md text-label-md">记录</span>
</button>
<!-- 洞察 (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="insights">insights</span>
<span class="font-label-md text-label-md">洞察</span>
</button>
<!-- 我的 (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low dark:hover:bg-surface-container-highest/10 transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">我的</span>
</button>
</nav>
</main>
</body></html>
