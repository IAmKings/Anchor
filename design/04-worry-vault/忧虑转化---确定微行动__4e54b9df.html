<!DOCTYPE html>

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Slow breathing animation for background atmosphere */
        @keyframes subtle-breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .breathe-effect {
            animation: subtle-breathe 8s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen flex flex-col text-on-surface antialiased font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Element -->
<div class="fixed inset-0 pointer-events-none overflow-hidden flex justify-center items-center opacity-30">
<div class="w-[80vw] h-[80vw] rounded-full bg-gradient-to-tr from-surface-container to-surface-bright blur-3xl breathe-effect"></div>
</div>
<!-- Contextual Top Bar (Task-Focused: Suppressing global TopAppBar & BottomNavBar) -->
<header class="relative z-10 w-full flex items-center justify-between px-margin-page h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-label-md text-label-md text-text-muted">转化动作</span>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-page pb-12 w-full max-w-md mx-auto">
<!-- Focus Area: The Worry Card -->
<section class="w-full mb-stack-lg animate-[fadeIn_0.5s_ease-out]">
<div class="bg-surface-card border border-border-subtle rounded-xl p-8 flex flex-col items-center text-center gap-6 shadow-sm">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="cloud" style="font-variation-settings: 'FILL' 0;">cloud</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary text-balance leading-relaxed">
                    “担心下周的项目汇报会搞砸”
                </h2>
<p class="font-label-md text-label-md text-text-muted mt-2">
                    记录于 2小时前
                </p>
</div>
</section>
<!-- Processing Actions: 3 Choices -->
<section class="w-full flex flex-col gap-4 animate-[slideUp_0.6s_ease-out]"><div class="w-full flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-muted px-1">明天要做的微行动：</label>
<div class="relative">
<input class="w-full p-5 bg-surface-card border border-border-subtle rounded-xl font-body-md text-text-primary focus:outline-none focus:border-primary transition-colors" type="text" value="穿好鞋走到楼下"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">edit</span>
</div>
</div>
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-label-md text-label-md shadow-sm hover:bg-surface-tint transition-colors active:scale-95">
        确认并同步到首页
    </button>
</div></section>
</main>
<!-- Simple entry animations -->
<style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
