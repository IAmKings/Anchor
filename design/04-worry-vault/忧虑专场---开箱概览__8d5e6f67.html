<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        /* Subtle pulsing animation for the "active session" indicator */
        @keyframes gentle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .pulse-slow {
            animation: gentle-pulse 4s ease-in-out infinite;
        }

        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        .safe-padding-bottom {
            padding-bottom: env(safe-area-inset-bottom, 80px);
        }

        /* Animation: Pencil Strike-through & Evaporate */
        @keyframes strike-through {
            0% { width: 0; opacity: 1; }
            100% { width: 100%; opacity: 1; }
        }
        @keyframes evaporate {
            0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.95); filter: blur(4px); margin-bottom: -100px; padding: 0; height: 0; border: none; overflow: hidden; }
        }
        .anim-evaporate {
            animation: evaporate 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.4s; /* wait for strike-through */
        }
        .text-strike-container {
            position: relative;
            display: inline-block;
        }
        .text-strike-line {
            position: absolute;
            top: 50%;
            left: 0;
            height: 2px;
            background-color: theme('colors.text-muted');
            width: 0;
            opacity: 0;
            transform: translateY(-50%);
        }
        .do-strike .text-strike-line {
            animation: strike-through 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Animation: Shrink & Archive */
        @keyframes archive-down {
            0% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            40% { opacity: 0.8; transform: scale(0.8) translateY(20px); filter: blur(0); }
            100% { opacity: 0; transform: scale(0.4) translateY(200px); filter: blur(2px); margin-bottom: -100px; padding: 0; height: 0; border: none; overflow: hidden; }
        }
        .anim-archive {
            animation: archive-down 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            transform-origin: bottom center;
        }

        /* Card Action Overlay styles */
        .card-actions {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .card-container:hover .card-actions,
        .card-container:focus-within .card-actions {
            opacity: 1;
            pointer-events: auto;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: theme('colors.surface-container-low');
            border: 1px solid theme('colors.border-subtle');
            color: theme('colors.primary');
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .action-btn:hover {
            transform: scale(1.05);
            background-color: theme('colors.surface-container');
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .action-btn span.material-symbols-outlined {
            font-size: 24px;
            margin-bottom: 2px;
        }
        .action-btn span.label {
            font-size: 10px;
            font-weight: 600;
            font-family: theme('fontFamily.label-md');
        }

        /* Make sure dark mode handles overlays well */
        html.dark .card-actions {
            background: rgba(38, 37, 33, 0.85);
        }
    </style>

<script>
    function triggerEvaporate(button) {
        const card = button.closest('.card-container');
        const strikeContainer = card.querySelector('.text-strike-container');
        
        // Hide actions immediately
        card.querySelector('.card-actions').style.display = 'none';
        
        // Add class to trigger strike-through animation
        strikeContainer.classList.add('do-strike');
        
        // Add evaporate class to the whole card
        card.classList.add('anim-evaporate');
        
        // Optional: remove element from DOM after animation completes
        setTimeout(() => {
            // card.remove();
        }, 1200);
    }

    function triggerArchive(button) {
        const card = button.closest('.card-container');
        
        // Hide actions immediately
        card.querySelector('.card-actions').style.display = 'none';
        
        // Add archive animation class
        card.classList.add('anim-archive');
        
        // Optional: remove element from DOM after animation completes
        setTimeout(() => {
            // card.remove();
        }, 800);
    }
</script>
