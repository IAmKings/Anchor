<canvas id="shader-canvas-ANIMATION_28" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_28');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

// Simplified noise for organic movement
float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
    vec2 uv = v_texCoord;
    
    // Wave movement
    float wave = noise(uv * 3.0 + u_time * 0.2);
    float wave2 = noise(uv * 2.0 - u_time * 0.15);
    
    // Colors from Anchor Grounding System
    vec3 color1 = vec3(0.478, 0.608, 0.525); // #7a9b86 (Sage)
    vec3 color2 = vec3(0.988, 0.976, 0.953); // #fcf9f3 (Surface)
    
    float mask = smoothstep(0.4, 0.6, uv.y + (wave - 0.5) * 0.2);
    vec3 finalColor = mix(color1, color2, mask + wave2 * 0.1);
    
    // Subtle circular vignetting for a grounded feel
    float dist = distance(uv, vec2(0.5));
    finalColor *= (1.0 - dist * 0.3);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<button class="flex items-center justify-center gap-2 py-2 px-4 rounded-full font-label-md text-label-md text-text-muted opacity-60 hover:opacity-100 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-[18px]">close</span>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerDisplay = document.getElementById('timer-display');
            const progressRing = document.getElementById('progress-ring');
            const finishBtn = document.getElementById('finish-btn');
            
            const totalSeconds = 5 * 60;
            let remainingSeconds = totalSeconds - 1; 
            const circumference = 2 * Math.PI * 48;

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const updateTimer = () => {
                if (remainingSeconds < 0) return;

                timerDisplay.textContent = formatTime(remainingSeconds);
                
                const offset = circumference - (remainingSeconds / totalSeconds) * circumference;
                progressRing.style.strokeDashoffset = offset;

                if (remainingSeconds <= totalSeconds / 2) {
                    finishBtn.classList.remove('bg-surface-container-highest', 'text-text-muted');
                    finishBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
                }

                remainingSeconds--;
            };

            setInterval(updateTimer, 1000);
        });
    </script>
