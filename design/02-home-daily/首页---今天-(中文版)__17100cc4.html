<!DOCTYPE html>

<html class="light" lang="zh"><head>
<meta charset="utf-8"/>

<title>Anchor - Home</title>

<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .wave-animation {
            animation: slow-pulse 6s ease-in-out infinite;
        }

        .wave-ring {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            border: 1px solid theme('colors.primary-container');
            animation: ripple 6s ease-out infinite;
        }

        .wave-ring:nth-child(2) {
            animation-delay: 2s;
        }

        @keyframes slow-pulse {
            0%, 100% { transform: scale(1); background-color: theme('colors.primary-container'); }
            50% { transform: scale(1.02); background-color: theme('colors.primary-fixed'); }
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-text-primary min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-dark-bg/80 backdrop-blur-xl border-b border-border-subtle/30 flex justify-between items-center px-margin-page h-16">
<button aria-label="Menu" class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-300 flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="anchor">anchor</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-primary dark:text-primary-fixed-dim text-center">
            Anchor
        </div>
<button aria-label="Help right now" class="text-error dark:text-error hover:opacity-80 transition-opacity active:scale-95 duration-300 flex items-center justify-center p-2 -mr-2 bg-error-container/30 rounded-full">
<span class="material-symbols-outlined" data-icon="emergency">emergency</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-20 pb-32 flex flex-col relative overflow-x-hidden">
<!-- Disclaimer -->
<div class="px-margin-page text-center mb-stack-lg">
<p class="font-label-md text-label-md text-text-muted">应用仅适用于轻度调节</p>
</div>
<!-- The Wave (Central Grounding Feature) -->
<section class="flex flex-col items-center justify-center px-margin-page mb-stack-lg relative py-8">
<div class="relative w-48 h-48 flex items-center justify-center cursor-pointer active:scale-95 transition-transform duration-700 ease-out">
<div class="wave-ring"></div>
<div class="wave-ring"></div>
<button aria-label="Start emotional grounding" class="wave-animation w-full h-full rounded-full flex flex-col items-center justify-center text-on-primary-container z-10 shadow-sm border border-border-subtle/20">
<span class="material-symbols-outlined text-4xl mb-2 opacity-80" style="font-variation-settings: 'FILL' 0;">water_drop</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">浪潮等待</span>
<span class="font-label-md text-label-md opacity-80 mt-1">等待中</span>
</button>
</div>
<p class="font-body-md text-body-md text-text-muted mt-6 text-center max-w-[240px]">
                难受的时候点这里
            </p>
</section>
<!-- Daily Flow Bento Grid -->
<section class="px-margin-page grid grid-cols-2 gap-gutter-card relative z-10">
<!-- Morning Rhythm (Full Width) -->
<div class="col-span-2 bg-surface-card border border-border-subtle rounded-xl p-5 flex flex-col relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-surface-card to-primary-fixed/20 opacity-50 pointer-events-none"></div>
<div class="flex justify-between items-start mb-4 relative z-10">
<div>
<h3 class="font-label-md text-label-md text-text-muted mb-1 uppercase tracking-wider">晨间节律</h3>
<p class="font-body-md text-body-md text-text-primary">见光记录</p>
</div>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
</div>
<div class="flex items-center gap-3 relative z-10 mt-2">
<div class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-1/3 transition-all duration-1000 ease-out"></div>
</div>
<span class="font-label-md text-label-md text-text-muted">温和开始</span>
</div>
</div>
<!-- Micro-action -->
<div class="col-span-1 bg-surface-card border border-border-subtle rounded-xl p-5 flex flex-col justify-between">
<div>
<span class="material-symbols-outlined text-secondary-container mb-3" style="font-variation-settings: 'FILL' 0;">directions_walk</span>
<p class="font-body-md text-body-md text-text-primary mb-4 leading-snug">穿好鞋走到楼下</p>
</div>
<button class="text-left font-label-md text-label-md text-primary flex items-center group">
                    开始 5 分钟
                    <span class="material-symbols-outlined ml-1 text-[18px] group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
</button>
</div>
<!-- Worry Safe Box -->
<div class="col-span-1 bg-surface-card border border-border-subtle rounded-xl p-5 flex flex-col justify-between">
<div>
<span class="material-symbols-outlined text-tertiary-container mb-3" style="font-variation-settings: 'FILL' 0;">inventory_2</span>
<h3 class="font-label-md text-label-md text-text-muted mb-1">忧虑保险箱</h3>
<p class="font-numeral-mono text-numeral-mono text-text-primary">3 <span class="font-body-md text-body-md text-text-muted">张卡</span></p>
</div>
<div class="mt-4 pt-4 border-t border-border-subtle/50">
<p class="font-label-md text-label-md text-text-muted flex items-center">
<span class="material-symbols-outlined text-[16px] mr-1">lock_clock</span>
                        20:00 解锁
                    </p>
</div>
</div>
</section>
</main>
<!-- FAB for Quick Note -->
<button aria-label="Quick Note" class="fixed bottom-24 right-margin-page bg-primary text-on-primary w-14 h-14 rounded-full flex items-center justify-center z-40 hover:opacity-90 active:scale-95 transition-all duration-300 outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit</span>
</button>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 w-full rounded-t-xl z-50 bg-surface-container-low/90 dark:bg-dark-card/90 backdrop-blur-2xl border-t border-border-subtle/50 flex justify-around items-center pb-safe pt-stack-sm px-2 md:hidden">
<!-- Active: Today -->
<a class="flex flex-col items-center justify-center bg-primary-container/40 dark:bg-primary-container text-on-primary-container rounded-full px-5 py-1.5 transition-all duration-500 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 ease-out" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">today</span>
<span class="font-label-md text-label-md">今天</span>
</a>
<!-- Inactive: Journal -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="edit_note">edit_note</span>
<span class="font-label-md text-label-md">记录</span>
</a>
<!-- Inactive: Insights -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_graph">auto_graph</span>
<span class="font-label-md text-label-md">洞察</span>
</a>
<!-- Inactive: Me -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">我的</span>
</a>
</nav>
</body></html>
