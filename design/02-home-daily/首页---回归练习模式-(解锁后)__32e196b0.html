<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Anchor - Home</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-card": "#FFFFFF",
                        "surface-bright": "#fcf9f3",
                        "surface-container": "#f0eee8",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#424843",
                        "tertiary-container": "#9a9288",
                        "outline-variant": "#c2c8c1",
                        "tertiary-fixed-dim": "#cec5ba",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "dark-bg": "#1C1B18",
                        "surface": "#fcf9f3",
                        "background": "#fcf9f3",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e5e2dc",
                        "surface-container-highest": "#e5e2dc",
                        "inverse-on-surface": "#f3f0ea",
                        "dark-card": "#262521",
                        "surface-dim": "#dcdad4",
                        "on-secondary-container": "#783c24",
                        "secondary": "#8e4d34",
                        "text-muted": "#8A837A",
                        "on-tertiary-container": "#302b24",
                        "surface-tint": "#466552",
                        "surface-container-low": "#f6f3ed",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ebe8e2",
                        "on-surface": "#1c1c18",
                        "on-secondary-fixed": "#380d00",
                        "secondary-container": "#feaa8b",
                        "on-primary-fixed": "#012112",
                        "tertiary": "#645d55",
                        "primary-fixed": "#c8ebd3",
                        "secondary-fixed": "#ffdbcf",
                        "secondary-fixed-dim": "#ffb59a",
                        "primary-fixed-dim": "#accfb8",
                        "on-tertiary-fixed-variant": "#4c463e",
                        "text-primary": "#33302B",
                        "inverse-surface": "#31312d",
                        "border-subtle": "#E3DDD3",
                        "primary-container": "#7a9b86",
                        "outline": "#727973",
                        "primary": "#466552",
                        "on-primary-fixed-variant": "#2e4d3c",
                        "on-background": "#1c1c18",
                        "tertiary-fixed": "#ebe1d6",
                        "on-primary-container": "#133222",
                        "on-secondary-fixed-variant": "#71361f",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#accfb8",
                        "on-tertiary-fixed": "#1f1b14"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-card": "16px",
                        "stack-md": "24px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-lg": "40px",
                        "margin-page": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["manrope"],
                        "headline-lg": ["manrope"],
                        "numeral-mono": ["jetbrainsMono"],
                        "headline-lg-mobile": ["manrope"],
                        "label-md": ["manrope"],
                        "body-md": ["manrope"]
                    },
                    "fontSize": {
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "headline-lg": ["22px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "numeral-mono": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["17px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Slow breathing animation for The Wave */
        @keyframes breath {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }
        .animate-breath {
            animation: breath 6s ease-in-out infinite;
        }
        
        /* Ensure font loading */
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');
        body { font-family: 'Manrope', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-text-primary min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container pb-32">
<!-- TopAppBar (Shared Component) -->
<header class="fixed top-0 w-full backdrop-blur-xl bg-surface/80 flex items-center justify-between px-margin-page h-16 z-50 transition-all duration-500 ease-in-out">
<button aria-label="Menu" class="flex items-center justify-center p-2 -ml-2 text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="spa" style="font-variation-settings: 'FILL' 0;">spa</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Anchor</h1>
<button aria-label="SOS" class="flex items-center justify-center p-2 -mr-2 text-error hover:opacity-80 transition-opacity bg-error-container/50 rounded-full">
<span class="material-symbols-outlined text-error" data-icon="emergency" style="font-variation-settings: 'FILL' 1;">emergency</span>
</button>
</header>
<!-- Main Canvas -->
<main class="pt-24 px-margin-page flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Welcome Banner -->
<section class="bg-surface-container-low rounded-xl p-gutter-card border border-border-subtle flex flex-col gap-stack-sm animate-fade-in-up">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]">waving_hand</span>
<span class="font-label-md text-label-md">Welcome Back</span>
</div>
<p class="font-body-md text-body-md text-on-surface">
                欢迎回来。今天想尝试挑一件最轻微的小事吗？
                <br/>
<span class="text-text-muted text-sm mt-1 block">(Would you like to try one tiny thing today?)</span>
</p>
</section>
<!-- Primary Action: The Wave -->
<section class="flex flex-col items-center justify-center py-4">
<button class="w-48 h-48 rounded-full bg-primary flex flex-col items-center justify-center gap-3 text-on-primary shadow-sm hover:bg-surface-tint transition-colors animate-breath">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">浪潮等待</span>
<span class="font-label-md text-label-md opacity-80">(Wave Waiting)</span>
</button>
</section>
<!-- Card Flow (Bento style grid) -->
<section class="grid grid-cols-1 gap-stack-md">
<!-- Morning Rhythm -->
<article class="bg-surface-card border border-border-subtle rounded-xl p-gutter-card flex items-start gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
</div>
<div class="flex flex-col gap-1 flex-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">起床 / 见光</h2>
<p class="font-body-md text-body-md text-text-muted">Ready to start. You have established a stable rhythm before.</p>
</div>
<button class="p-2 text-primary hover:bg-surface-container rounded-full transition-colors self-center">
<span class="material-symbols-outlined">play_arrow</span>
</button>
</article>
<!-- Micro-action -->
<article class="bg-surface-card border border-border-subtle rounded-xl p-gutter-card flex items-start gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shrink-0 border border-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">check_circle</span>
</div>
<div class="flex flex-col gap-2 flex-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">微行动</h2>
<p class="font-body-md text-body-md text-text-muted">Select a new tiny anchor for today.</p>
<button class="mt-2 py-2 px-4 border border-border-subtle text-primary font-label-md rounded-lg hover:bg-surface-container transition-colors w-fit flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Select new
                    </button>
</div>
</article>
<!-- Worry Safe Box -->
<article class="bg-surface-card border border-border-subtle rounded-xl p-gutter-card flex items-start gap-4 relative overflow-hidden">
<!-- Decorative background pattern for locked state -->
<div class="absolute inset-0 opacity-5 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,#000_10px,#000_20px)] pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-text-muted shrink-0 z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="flex flex-col gap-1 flex-1 z-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">忧虑保险箱</h2>
<p class="font-body-md text-body-md text-text-muted">3 cards locked until 20:00.</p>
</div>
</article>
</section>
</main>
<!-- BottomNavBar (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 backdrop-blur-2xl border-t border-border-subtle bg-surface/80 rounded-t-xl transition-all duration-300">
<!-- Active: Home -->
<button aria-current="page" class="flex flex-col items-center justify-center text-primary font-bold hover:opacity-80 transition-opacity scale-95 duration-300">
<div class="px-4 py-1 bg-primary-container/30 rounded-full mb-1">
<span class="material-symbols-outlined text-[24px]" data-icon="home_max" style="font-variation-settings: 'FILL' 1;">home_max</span>
</div>
<span class="font-label-md text-label-md">Home</span>
</button>
<!-- Inactive: The Wave -->
<button class="flex flex-col items-center justify-center text-text-muted opacity-60 hover:text-secondary transition-colors duration-300">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="water_drop" style="font-variation-settings: 'FILL' 0;">water_drop</span>
<span class="font-label-md text-label-md">The Wave</span>
</button>
<!-- Inactive: Reflect -->
<button class="flex flex-col items-center justify-center text-text-muted opacity-60 hover:text-secondary transition-colors duration-300">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="self_care" style="font-variation-settings: 'FILL' 0;">self_care</span>
<span class="font-label-md text-label-md">Reflect</span>
</button>
<!-- Inactive: Support -->
<button class="flex flex-col items-center justify-center text-text-muted opacity-60 hover:text-secondary transition-colors duration-300">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="emergency" style="font-variation-settings: 'FILL' 0;">emergency</span>
<span class="font-label-md text-label-md">Support</span>
</button>
</nav>
</body></html>
