<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>锚点 Anchor - 今天 (医疗等待模式)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#466552",
                        "on-error": "#ffffff",
                        "text-primary": "#33302B",
                        "on-secondary-container": "#783c24",
                        "on-tertiary-fixed": "#1f1b14",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fcf9f3",
                        "inverse-surface": "#31312d",
                        "background": "#fcf9f3",
                        "outline-variant": "#c2c8c1",
                        "primary": "#466552",
                        "surface-card": "#FFFFFF",
                        "primary-fixed-dim": "#accfb8",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#133222",
                        "on-secondary-fixed": "#380d00",
                        "secondary-container": "#feaa8b",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "border-subtle": "#E3DDD3",
                        "surface-variant": "#e5e2dc",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#424843",
                        "tertiary-container": "#9a9288",
                        "on-surface": "#1c1c18",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ebe1d6",
                        "surface": "#fcf9f3",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f3f0ea",
                        "on-primary-fixed": "#012112",
                        "secondary-fixed": "#ffdbcf",
                        "surface-container-high": "#ebe8e2",
                        "on-background": "#1c1c18",
                        "outline": "#727973",
                        "surface-dim": "#dcdad4",
                        "on-tertiary-fixed-variant": "#4c463e",
                        "secondary": "#8e4d34",
                        "secondary-fixed-dim": "#ffb59a",
                        "dark-bg": "#1C1B18",
                        "primary-fixed": "#c8ebd3",
                        "tertiary": "#645d55",
                        "on-secondary-fixed-variant": "#71361f",
                        "surface-container-highest": "#e5e2dc",
                        "tertiary-fixed-dim": "#cec5ba",
                        "dark-card": "#262521",
                        "primary-container": "#7a9b86",
                        "inverse-primary": "#accfb8",
                        "text-muted": "#8A837A",
                        "surface-container-low": "#f6f3ed",
                        "on-tertiary-container": "#302b24",
                        "on-primary-fixed-variant": "#2e4d3c",
                        "surface-container": "#f0eee8",
                        "status-emergency": "#B26A4F"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "unit": "4px",
                        "gutter-card": "16px",
                        "margin-page": "20px",
                        "stack-lg": "40px",
                        "stack-md": "24px",
                        "safe": "env(safe-area-inset-bottom, 20px)"
                    },
                    "fontFamily": {
                        "body-lg": ["manrope", "sans-serif"],
                        "body-md": ["manrope", "sans-serif"],
                        "headline-lg": ["manrope", "sans-serif"],
                        "label-md": ["manrope", "sans-serif"],
                        "headline-lg-mobile": ["manrope", "sans-serif"],
                        "numeral-mono": ["jetbrainsMono", "monospace"]
                    },
                    "fontSize": {
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "body-md": ["17px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["22px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "numeral-mono": ["24px", { "lineHeight": "32px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid theme('colors.border-subtle');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md min-h-screen relative pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-dark-bg/80 backdrop-blur-xl border-b border-border-subtle/30 flex justify-between items-center px-margin-page h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; color: theme('colors.status-emergency');">emergency</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">锚点 Anchor</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Canvas -->
<main class="pt-24 px-margin-page max-w-2xl mx-auto flex flex-col gap-stack-lg">
<!-- Status Banner -->
<section class="rounded-xl border border-border-subtle bg-surface-container-low p-gutter-card flex items-start gap-4">
<span class="material-symbols-outlined text-primary mt-1" style="font-variation-settings: 'FILL' 1;">info</span>
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">医疗等待期</h2>
<p class="font-body-md text-body-md text-on-surface-variant">暂停练习并非惩罚，而是为了在缺乏专业支持的情况下避免过度消耗。请将精力集中在寻求专业帮助和基础休养上。</p>
</div>
</section>
<!-- Primary Action Area (Replaces Wave Waiting) -->
<section class="glass-panel rounded-2xl p-6 text-center flex flex-col items-center justify-center min-h-[240px] gap-6">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mb-2 border border-border-subtle">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">local_hospital</span>
</div>
<div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary mb-2">寻求专业支持</h3>
<p class="font-body-md text-text-muted">你的状态需要专业的评估与帮助，这很正常。</p>
</div>
<button class="w-full max-w-xs bg-primary text-on-primary py-4 px-6 rounded-xl font-label-md hover:opacity-90 active:scale-95 transition-all">
                查看就医指南
            </button>
</section>
<!-- Permitted Features Bento Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Checklist Card -->
<button class="bg-surface-card border border-border-subtle rounded-xl p-5 text-left flex flex-col justify-between hover:bg-surface-container-lowest transition-colors h-40">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-primary-fixed">checklist</span>
</div>
<div>
<h4 class="font-label-md text-text-primary font-bold mb-1">躯体检查清单</h4>
<p class="text-sm text-text-muted line-clamp-2">为下一次医生问诊做准备，记录近期的身体感受。</p>
</div>
</button>
<!-- Journal Card -->
<button class="bg-surface-card border border-border-subtle rounded-xl p-5 text-left flex flex-col justify-between hover:bg-surface-container-lowest transition-colors h-40">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-surface-variant">edit_document</span>
</div>
<div>
<h4 class="font-label-md text-text-primary font-bold mb-1">双栏日志</h4>
<p class="text-sm text-text-muted line-clamp-2">记录此刻的感受，暂不进行分析与反思。</p>
</div>
</button>
</section>
<!-- Emergency Hotlines List -->
<section class="mt-4 mb-8">
<h3 class="font-label-md text-text-muted mb-4 px-2 uppercase tracking-widest">紧急联络与资源</h3>
<div class="bg-surface-card border border-border-subtle rounded-xl overflow-hidden divide-y divide-border-subtle">
<a class="flex items-center justify-between p-4 hover:bg-surface-container-lowest transition-colors" href="#">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-status-emergency">phone_in_talk</span>
<span class="font-body-md text-text-primary">全国心理危机干预热线</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</a>
<a class="flex items-center justify-between p-4 hover:bg-surface-container-lowest transition-colors" href="#">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-status-emergency">local_hospital</span>
<span class="font-body-md text-text-primary">附近精神专科医院导航</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</a>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/90 dark:bg-dark-bg/90 backdrop-blur-2xl border-t border-border-subtle/50 md:hidden">
<div class="flex justify-around items-center pt-2 pb-safe px-4">
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold active:scale-90 transition-transform duration-200 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">home_app_logo</span>
<span class="font-label-md text-label-md">今天</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low transition-colors active:scale-90 duration-200 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1">edit_note</span>
<span class="font-label-md text-label-md">记录</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low transition-colors active:scale-90 duration-200 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1">insights</span>
<span class="font-label-md text-label-md">洞察</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-outline-variant/60 hover:bg-surface-container-low transition-colors active:scale-90 duration-200 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">我的</span>
</button>
</div>
</nav>
<!-- Desktop SideNav (Hidden on Mobile) -->
<aside class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-surface-container-lowest border-r border-border-subtle/30 pt-20 px-4 flex-col gap-2">
<button class="flex items-center gap-4 p-3 rounded-lg bg-primary-container text-on-primary-container font-label-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home_app_logo</span>
            今天
        </button>
<button class="flex items-center gap-4 p-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors font-label-md">
<span class="material-symbols-outlined">edit_note</span>
            记录
        </button>
<button class="flex items-center gap-4 p-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors font-label-md">
<span class="material-symbols-outlined">insights</span>
            洞察
        </button>
<button class="flex items-center gap-4 p-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors font-label-md">
<span class="material-symbols-outlined">person</span>
            我的
        </button>
</aside>
</body></html>
