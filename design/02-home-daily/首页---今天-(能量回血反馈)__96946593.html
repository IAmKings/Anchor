<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }

            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(122, 155, 134, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(122, 155, 134, 0); }
        }
        
        .animate-breathe {
            animation: slow-breathe 5s ease-in-out infinite;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-dark-bg/80 backdrop-blur-xl border-b border-border-subtle/30 flex justify-between items-center px-margin-page h-16 md:hidden">
<button aria-label="SOS Emergency" class="text-secondary dark:text-secondary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-300 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tight">锚点 Anchor</h1>

</button>
</header>

<div class="flex items-center justify-center gap-2 opacity-70">
<span class="material-symbols-outlined text-[16px] text-text-muted">info</span>
<p class="font-label-md text-label-md text-text-muted">应用仅适用轻度调节</p>
</div>
<!-- The Wave Component (Core Anchor) -->
<section class="flex flex-col items-center justify-center py-stack-md">
<button class="group relative w-full max-w-[320px] aspect-square bg-primary-container rounded-full flex flex-col items-center justify-center gap-4 animate-breathe transition-all duration-500 active:scale-95 tap-highlight-none">
<div class="absolute inset-0 rounded-full border border-primary-container/50 scale-105 opacity-50 group-hover:scale-110 transition-transform duration-1000 ease-out"></div>
<div class="absolute inset-0 rounded-full border border-primary-container/20 scale-110 opacity-30 group-hover:scale-125 transition-transform duration-1000 ease-out delay-75"></div>
<div class="w-32 h-32 mb-4 mx-auto">{{DATA:ANIMATION:ANIMATION_15}}</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary-container tracking-tight">浪潮等待</h2>
<p class="font-body-md text-body-md text-on-primary-container/80">难受的时候点这里</p>
</button>
</section><div class="bg-primary-container/10 border border-primary-container/20 rounded-xl p-gutter-card flex flex-col items-center text-center gap-2 mb-4 animate-breathe">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary mb-1">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">感受到了能量的回升？</h3>

</div>

</div>
</div>
