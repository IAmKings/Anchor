name: Internal release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 显示版本，例如 0.1.1
        required: true
        type: string
      version_code:
        description: 整数 versionCode，必须大于已发出的包
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOL=$SDK/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$TOOL" ]; then
            TOOL=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode internal keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "缺少 secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anchor-internal.jks"

      - name: Build internal APK
        env:
          ANCHOR_KEYSTORE: ${{ runner.temp }}/anchor-internal.jks
          ANCHOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANCHOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANCHOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.version_code }}" =~ ^[0-9]+$ ]]; then
            echo "version_code 必须是整数"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleInternal --no-daemon \
            -PversionCode="${{ inputs.version_code }}" \
            -PversionName="${{ inputs.version_name }}"

      - name: Check embedded version
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=$(find androidApp/build/outputs/apk/internal -name '*.apk' | head -1)
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          BADGING=$("$SDK/build-tools/$BT/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "versionCode='${{ inputs.version_code }}'"
          printf '%s\n' "$BADGING" | grep -q "versionName='${{ inputs.version_name }}'"
          cp "$APK" "$RUNNER_TEMP/anchor-internal-${{ inputs.version_name }}.apk"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "anchor-version-code: ${VERSION_CODE}" \
            "anchor-version-name: ${VERSION_NAME}" \
            "" \
            "内部测试包。若手机上已有 Debug 签名的锚点，先在应用里加密导出，再卸载，然后安装本包。正式版上架后证书不同，也不能覆盖安装，请先导出。" \
            > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION_NAME}" \
            --prerelease \
            --title "${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/anchor-internal-${VERSION_NAME}.apk"
